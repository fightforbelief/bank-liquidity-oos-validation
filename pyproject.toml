[project]
name = "p12-bank-liquidity-oos-validation"
version = "0.1.0"
description = "Gated audit utilities for bank cash-liquidity forecast validation"
requires-python = ">=3.11"
dependencies = ["PyYAML"]

[project.scripts]
p12 = "p12_bank_liquidity.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
